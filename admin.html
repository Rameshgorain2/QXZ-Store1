<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Qxz Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b0f19; color: white; margin: 0; padding: 0; }
        * { box-sizing: border-box; }

        /* Login Screen */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 10000;
        }
        .login-box { background: #1e293b; padding: 30px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px; border: 1px solid #334155; }
        .login-box h2 { color: #FFA903; margin-top: 0; }
        .login-box input { width: 100%; padding: 15px; margin: 15px 0; background: #0b0f19; border: 1px solid #334155; color: white; border-radius: 5px; }
        .login-box button { background: #3b82f6; color: white; padding: 15px; width: 100%; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Dashboard Header */
        .header { background: #131a2a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
        .header h2 { margin: 0; color: #FFA903; font-size: 20px; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
        .stat-card { background: #1e293b; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .stat-card h3 { margin: 0; font-size: 24px; color: #22c55e; }
        .stat-card p { margin: 5px 0 0 0; color: #cbd5e1; font-size: 13px; }

        /* Tabs */
        .tabs { display: flex; overflow-x: auto; padding: 0 20px; gap: 10px; }
        .tab { background: #1e293b; border: 1px solid #334155; color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .tab.active { background: #FFA903; color: black; font-weight: bold; border-color: #FFA903; }

        /* Tables/Lists */
        .data-section { padding: 20px; display: none; }
        .data-section.active { display: block; }
        
        .customer-card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #3b82f6; }
        .customer-card.incomplete { border-left-color: #ef4444; }
        .customer-card.almost { border-left-color: #f59e0b; }
        .customer-card.success { border-left-color: #22c55e; }

        .c-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .c-details { color: #cbd5e1; font-size: 13px; line-height: 1.5; }
        .c-utr { background: #0f172a; padding: 5px 10px; border-radius: 5px; color: #FFA903; font-family: monospace; display: inline-block; margin-top: 10px; }
        
        .action-btn { background: #22c55e; color: white; border: none; padding: 8px 15px; border-radius: 5px; margin-top: 10px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h2><i class="fa-solid fa-lock"></i> Admin Panel</h2>
            <p style="color: #cbd5e1; font-size: 14px;">Authorized Access Only</p>
            <input type="password" id="adminPass" placeholder="Enter Admin Password">
            <button onclick="checkPassword()">Login Securely</button>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD (Hidden till login) -->
    <div id="main-dashboard" style="display: none;">
        <div class="header">
            <h2>Qxz Store Admin</h2>
            <button onclick="logout()" style="background:transparent; color:#ef4444; border:none; cursor:pointer;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="stat-revenue">₹0</h3>
                <p>Total Revenue</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-sales">0</h3>
                <p>Successful Sales</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-incomplete" style="color: #ef4444;">0</h3>
                <p>Incomplete (Leads)</p>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('incomplete')">1. Incomplete</div>
            <div class="tab" onclick="switchTab('almost')">2. Almost Complete (Verify)</div>
            <div class="tab" onclick="switchTab('successful')">3. Successful</div>
        </div>

        <!-- Tab Contents -->
        <div id="tab-incomplete" class="data-section active">
            <h3 style="color: #ef4444;">People who didn't pay (Follow up)</h3>
            <div id="list-incomplete">Loading...</div>
        </div>

        <div id="tab-almost" class="data-section">
            <h3 style="color: #f59e0b;">Check UTR & Approve</h3>
            <div id="list-almost">Loading...</div>
        </div>

        <div id="tab-successful" class="data-section">
            <h3 style="color: #22c55e;">Fully Paid Students</h3>
            <div id="list-successful">Loading...</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // --- LOGIN LOGIC ---
        function checkPassword() {
            let pass = document.getElementById("adminPass").value;
            if(pass === "RG@OWNER#") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-dashboard").style.display = "block";
                fetchData(); // Load data only after login
            } else {
                alert("Incorrect Password! You are not Ramesh.");
            }
        }
        function logout() { location.reload(); }

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyBOu3BGlFXXSYUpP0P5VLo-qSGXITptN3c",
            authDomain: "landing-page-305c5.firebaseapp.com",
            databaseURL: "https://landing-page-305c5-default-rtdb.firebaseio.com",
            projectId: "landing-page-305c5",
            storageBucket: "landing-page-305c5.firebasestorage.app",
            messagingSenderId: "337738276300",
            appId: "1:337738276300:web:80c5b0c289a55f7dad9169"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // --- TAB SWITCH LOGIC ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.data-section').forEach(s => s.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // --- FETCH DATA FROM FIREBASE (REAL-TIME) ---
        function fetchData() {
            db.collection("customers").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
                
                let listIncomplete = "";
                let listAlmost = "";
                let listSuccessful = "";
                
                let countIncomplete = 0;
                let countSales = 0;

                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    let id = doc.id;
                    let date = data.timestamp ? data.timestamp.toDate().toLocaleString() : "Just now";

                    let cardHTML = `
                        <div class="customer-card ${data.status === 'Incomplete' ? 'incomplete' : (data.status === 'Almost Complete' ? 'almost' : 'success')}">
                            <div class="c-name"><i class="fa-regular fa-user"></i> ${data.firstName} ${data.lastName}</div>
                            <div class="c-details">
                                📧 ${data.email}<br>
                                📱 ${data.phone}<br>
                                🕒 ${date}
                            </div>
                    `;

                    // Categorize based on status
                    if(data.status === "Incomplete") {
                        countIncomplete++;
                        listIncomplete += cardHTML + `</div>`; // Close card
                    } 
                    else if (data.status === "Almost Complete") {
                        listAlmost += cardHTML + `
                                <div class="c-utr">UTR: ${data.utrNumber}</div><br>
                                <button class="action-btn" onclick="markSuccessful('${id}')">Verify & Mark Successful</button>
                            </div>`;
                    }
                    else if (data.status === "Successful") {
                        countSales++;
                        listSuccessful += cardHTML + `
                                <div class="c-utr" style="color:#22c55e;">Verified UTR: ${data.utrNumber}</div>
                            </div>`;
                    }
                });

                // Update UI
                document.getElementById('list-incomplete').innerHTML = listIncomplete || "<p>No data found.</p>";
                document.getElementById('list-almost').innerHTML = listAlmost || "<p>No pending verifications.</p>";
                document.getElementById('list-successful').innerHTML = listSuccessful || "<p>No sales yet.</p>";

                // Update Stats
                document.getElementById('stat-incomplete').innerText = countIncomplete;
                document.getElementById('stat-sales').innerText = countSales;
                document.getElementById('stat-revenue').innerText = "₹" + (countSales * 299);
            });
        }

        // --- ADMIN ACTION: MARK AS SUCCESSFUL ---
        function markSuccessful(docId) {
            if(confirm("Are you sure this UTR is verified and payment is received in your bank?")) {
                db.collection("customers").doc(docId).update({
                    status: "Successful",
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    // Firebase realtime listener will auto-update the UI!
                }).catch((error) => {
                    alert("Error updating status: " + error);
                });
            }
        }
    </script>
</body>
</html>
